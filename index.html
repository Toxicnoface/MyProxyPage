<!DOCTYPE html>
<html>
<head>
    <title>Simple Web Proxy</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input[type="text"] { width: 70%; padding: 10px; font-size: 1.2em; }
        button { padding: 10px 20px; font-size: 1.2em; }
        #result { width: 100%; height: 80%; border: none; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Enter a URL to Visit</h2>
    <input type="text" id="urlInput" placeholder="e.g., www.example.com">
    <button onclick="visitSite()">Go</button>

    <iframe id="result" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>

    <script>
        function visitSite() {
            let targetUrl = document.getElementById('urlInput').value.trim();
            if (!targetUrl) return;
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }
            // Use corsproxy.io as the relay. You can try other services.
            const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);
            document.getElementById('result').src = proxyUrl;
        }
    </script>
</body>
</html>
